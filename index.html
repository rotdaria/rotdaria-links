<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotdaria | Links Oficiais</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-base: #090b10;
      --bg-card: #121620;
      --bg-btn: #181d2a;
      --bg-btn-hover: #1f2636;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-cyan: #00f2fe;
      --accent-green: #10b981;
      --accent-red: #ff2a5f;
      --glow-primary: rgba(0, 242, 254, 0.25);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.12) 0%, transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(16, 185, 129, 0.08) 0%, transparent 45%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 24px;
      padding: 36px 24px 28px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Cabeçalho e Avatar */
    .avatar-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      margin-bottom: 18px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
      box-shadow: 0 0 24px var(--glow-primary);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #0f131c;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 3px solid var(--bg-card);
    }

    .avatar svg {
      width: 52px;
      height: 52px;
      color: var(--accent-cyan);
    }

    .username {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    .verified-badge {
      width: 18px;
      height: 18px;
      color: var(--accent-cyan);
      flex-shrink: 0;
    }

    .bio {
      font-size: 0.925rem;
      line-height: 1.5;
      color: var(--text-secondary);
      max-width: 340px;
      margin-bottom: 28px;
    }

    /* Lista de Botões */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 32px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 16px 20px;
      background: var(--bg-btn);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      text-decoration: none;
      color: var(--text-primary);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
      overflow: hidden;
    }

    .link-btn:hover {
      transform: translateY(-2px);
      background: var(--bg-btn-hover);
    }

    .link-btn:active {
      transform: translateY(0);
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.25s ease;
    }

    .link-btn:hover .icon-box {
      transform: scale(1.06);
    }

    .btn-text {
      display: flex;
      flex-direction: column;
    }

    .btn-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .btn-subtitle {
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .arrow-icon {
      width: 20px;
      height: 20px;
      color: var(--text-secondary);
      transition: transform 0.25s ease, color 0.25s ease;
      flex-shrink: 0;
    }

    .link-btn:hover .arrow-icon {
      transform: translateX(3px);
      color: var(--text-primary);
    }

    /* Estilos específicos por plataforma */
    .btn-tiktok:hover {
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 8px 24px rgba(0, 242, 254, 0.14);
    }
    .btn-tiktok .icon-box {
      background: rgba(0, 242, 254, 0.12);
      color: var(--accent-cyan);
    }

    .btn-youtube:hover {
      border-color: rgba(255, 42, 95, 0.5);
      box-shadow: 0 8px 24px rgba(255, 42, 95, 0.14);
    }
    .btn-youtube .icon-box {
      background: rgba(255, 42, 95, 0.12);
      color: var(--accent-red);
    }

    .btn-livepix {
      border-color: rgba(16, 185, 129, 0.28);
      background: linear-gradient(145deg, #181d2a 0%, rgba(16, 185, 129, 0.08) 100%);
    }
    .btn-livepix:hover {
      border-color: rgba(16, 185, 129, 0.65);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.18);
    }
    .btn-livepix .icon-box {
      background: rgba(16, 185, 129, 0.16);
      color: var(--accent-green);
    }

    .badge-destaque {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* Rodapé */
    footer {
      font-size: 0.78rem;
      color: #64748b;
      border-top: 1px solid var(--border-subtle);
      width: 100%;
      padding-top: 18px;
    }

    @media (max-width: 380px) {
      .container {
        padding: 28px 18px 22px;
      }
      .link-btn {
        padding: 14px 16px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <!-- Cabeçalho -->
    <div class="avatar-wrapper">
      <div class="avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <line x1="6" y1="12" x2="10" y2="12"></line>
          <line x1="8" y1="10" x2="8" y2="14"></line>
          <line x1="15" y1="13" x2="15.01" y2="13"></line>
          <line x1="18" y1="11" x2="18.01" y2="11"></line>
          <rect x="2" y="6" width="20" height="12" rx="6"></rect>
        </svg>
      </div>
    </div>

    <h1 class="username">
      Rotdaria
      <svg class="verified-badge" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 2L14.8 4.2L18.4 4.1L19.4 7.5L22.3 9.6L21.1 13L22.3 16.4L19.4 18.5L18.4 21.9L14.8 21.8L12 24L9.2 21.8L5.6 21.9L4.6 18.5L1.7 16.4L2.9 13L1.7 9.6L4.6 7.5L5.6 4.1L9.2 4.2L12 2ZM10.3 16.2L17.1 9.4L15.7 8L10.3 13.4L7.9 11L6.5 12.4L10.3 16.2Z"/>
      </svg>
    </h1>

    <p class="bio">Criador de conteúdo, games e transmissões ao vivo. Acompanhe nas outras redes!</p>

    <!-- Lista de Links -->
    <nav class="links-list" aria-label="Redes sociais e apoio">
      <!-- TikTok -->
      <a href="https://www.tiktok.com/@rotdari" target="_blank" rel="noopener noreferrer" class="link-btn btn-tiktok">
        <div class="btn-left">
          <div class="icon-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">TikTok</span>
            <span class="btn-subtitle">Siga para clipes, cortes e lives diárias</span>
          </div>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>

      <!-- YouTube -->
      <a href="https://www.youtube.com/@Rotdari" target="_blank" rel="noopener noreferrer" class="link-btn btn-youtube">
        <div class="btn-left">
          <div class="icon-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">YouTube</span>
            <span class="btn-subtitle">Inscreva-se para vídeos completos e gameplays</span>
          </div>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>

      <!-- LivePix -->
      <a href="https://livepix.gg/rotdaria" target="_blank" rel="noopener noreferrer" class="link-btn btn-livepix">
        <div class="btn-left">
          <div class="icon-box">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </div>
          <div class="btn-text">
            <span class="btn-title">LivePix <span class="badge-destaque">Apoiar</span></span>
            <span class="btn-subtitle">Envie sua mensagem na tela ao vivo</span>
          </div>
        </div>
        <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </a>
    </nav>

    <!-- Rodapé -->
    <footer>
      <p>© 2026 Rotdaria • Todos os direitos reservados</p>
    </footer>
  </main>
</body>
</html>
